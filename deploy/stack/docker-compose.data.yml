# Baalvion data layer. PostgreSQL replaces AWS RDS; Redis and Neo4j were
# already on-box under AWS. All three are public images - no ECR needed.
name: baalvion

services:
  postgres:
    image: postgres:16
    container_name: baalvion-postgres
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 384m
    environment:
      POSTGRES_USER: baalvion_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: baalvion
      # Matches the RDS collation so the restore behaves identically.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback ONLY - never exposed to the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baalvion_app -d baalvion"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: baalvion-redis
    restart: unless-stopped
    mem_limit: 320m
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: baalvion-neo4j
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  neo4jdata:
