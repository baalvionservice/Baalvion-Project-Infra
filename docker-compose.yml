version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Baalvion Backend — Full Stack Docker Compose
#  Boots: PostgreSQL · Redis · All Node.js microservices
#  Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

networks:
  baalvion:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

x-common-env: &common-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: baalvion_db
  DB_USER: baalvion
  DB_PASSWORD: bc9f9cda3360df884bdec7d75c4bebfc
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379
  JWT_ISSUER: baalvion-auth
  JWT_AUDIENCE: baalvion-services
  BAALVION_JWKS_URI: http://auth-service:3001/.well-known/jwks.json
  JWKS_URI: http://auth-service:3001/.well-known/jwks.json
  JWKS_TTL_MS: "300000"
  JWT_PUBLIC_KEY_B64: 
  INTERNAL_SERVICE_SECRET: 266614b02e12f65ebb45a041da81b97ce0924f2b1166ffc3f4efaa6c99563004
  CORS_ORIGINS: "http://localhost:9004,http://localhost:3000,https://community.marketunderworld.com"

x-node-service: &node-service
  restart: unless-stopped
  networks:
    - baalvion
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ────────────────────────────── INFRASTRUCTURE ──────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: baalvion-postgres
    restart: unless-stopped
    networks:
      - baalvion
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: baalvion
      POSTGRES_PASSWORD: bc9f9cda3360df884bdec7d75c4bebfc
      POSTGRES_DB: baalvion_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baalvion -d baalvion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: baalvion-redis
    restart: unless-stopped
    networks:
      - baalvion
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────── IDENTITY DOMAIN ────────────────────────────────

  auth-service:
    <<: *node-service
    container_name: baalvion-auth
    build:
      context: .
      dockerfile: Backend/services/identity/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      <<: *common-env
      PORT: "3001"
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACCESS_SECRET: 439033268b411d0f33f86425d6bade672717381df85d1ce0585472b0cd0d0704d998027a0e28e8361cf2ec19b7f507ab
      JWT_REFRESH_SECRET: bd41a6fac4e8eb1bdd4947f2079c6ef94855660095c5de16357729d757afaeefc837df4e8a5d5e25197ca72d5edb1f8d
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: "12"
      RATE_LIMIT_IP_MAX: "20"
      EMAIL_FROM: noreply@baalvion.com
      API_BASE_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:9004
    volumes:
      - ./Backend/services/identity/auth-service/keys:/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  session-service:
    <<: *node-service
    container_name: baalvion-session
    build:
      context: .
      dockerfile: Backend/services/identity/session-service/Dockerfile
    ports:
      - "3022:3022"
    environment:
      <<: *common-env
      PORT: "3022"
    depends_on:
      auth-service:
        condition: service_healthy

  rbac-service:
    <<: *node-service
    container_name: baalvion-rbac
    build:
      context: .
      dockerfile: Backend/services/identity/rbac-service/Dockerfile
    ports:
      - "3055:3055"
    environment:
      <<: *common-env
      PORT: "3055"
    depends_on:
      auth-service:
        condition: service_healthy

  # ──────────────────────── INFRASTRUCTURE DOMAIN ─────────────────────────────

  realtime-service:
    <<: *node-service
    container_name: baalvion-realtime
    build:
      context: .
      dockerfile: Backend/services/infrastructure/realtime-service/Dockerfile
    ports:
      - "3040:3040"
    environment:
      <<: *common-env
      PORT: "3040"
      ALLOWED_ORIGINS: "http://localhost:9004,http://localhost:3000,https://community.marketunderworld.com"
      JWT_BYPASS_AUTH: "false"
      AUTH_SERVICE_URL: http://auth-service:3001
      ADMIN_SERVICE_URL: http://admin-service:3021
      SESSION_SERVICE_URL: http://session-service:3022
      NOTIF_SERVICE_URL: http://notification-service:3031
      COMMUNITY_SERVICE_URL: http://community-service:3064
      METRICS_INTERVAL: "5000"
      HEALTH_INTERVAL: "10000"
      WS_RATE_LIMIT_PER_MINUTE: "60"
    depends_on:
      auth-service:
        condition: service_healthy

  notification-service:
    <<: *node-service
    container_name: baalvion-notification
    build:
      context: .
      dockerfile: Backend/services/infrastructure/notification-service/Dockerfile
    ports:
      - "3031:3031"
    environment:
      <<: *common-env
      PORT: "3031"
      EMAIL_FROM: noreply@baalvion.com
      EMAIL_FROM_NAME: Baalvion
      EMAIL_REPLY_TO: support@baalvion.com
      EMAIL_RATE_LIMIT_PER_HOUR: "10"
      SMS_RATE_LIMIT_PER_HOUR: "10"
      PUSH_PROVIDER: auto

  # ─────────────────────────── PLATFORM DOMAIN ────────────────────────────────

  admin-service:
    <<: *node-service
    container_name: baalvion-admin
    build:
      context: .
      dockerfile: Backend/services/platform/admin-service/Dockerfile
    ports:
      - "3021:3021"
    environment:
      <<: *common-env
      PORT: "3021"
      AUTH_SERVICE_URL: http://auth-service:3001
      COMMUNITY_SERVICE_URL: http://community-service:3064
      REALTIME_SERVICE_URL: http://realtime-service:3040
    depends_on:
      auth-service:
        condition: service_healthy

  # ─────────────────────────── ECOSYSTEM DOMAIN ───────────────────────────────

  community-service:
    <<: *node-service
    container_name: baalvion-community
    build:
      context: .
      dockerfile: Backend/services/ecosystem/community-service/Dockerfile
    ports:
      - "3064:3064"
    environment:
      <<: *common-env
      PORT: "3064"
      JWT_AUDIENCE: baalvion-platform
      RATE_LIMIT_IP_MAX: "120"
      NODEBB_BASE_URL: http://nodebb:4567
      NODEBB_WRITE_API_TOKEN: ""
      PAYMENT_SERVICE_URL: http://localhost:3015
      PAYMENT_SPINE: "false"
    depends_on:
      auth-service:
        condition: service_healthy

  jobs-service:
    <<: *node-service
    container_name: baalvion-jobs
    build:
      context: .
      dockerfile: Backend/services/ecosystem/jobs-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      <<: *common-env
      PORT: "3002"
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      auth-service:
        condition: service_healthy
