apiVersion: baalvion.io/v1
kind: Service
metadata:
  name: product-registry-service
  description: >-
    GTOS canonical product master: SKU/GTIN, HS classification, document requirements.
  domain: commerce
  division: commerce
  context: trade-product-registry
  owner: "@baalvion/commerce"
  # tier derived from blast radius at registration — confirm with the owning team.
  tier: tier-2
  repo: baalvion-platform
  path: Backend/services/trade/product-registry-service
spec:
  lifecycle: production
  language: node
  datastores: [postgres]
  dependsOn: [auth-service]
  consumesEvents: []
  producesEvents: []
  slo: { availability: 0.99, latencyP95Ms: 400 }
  deploy: { chart: baalvion-service, namespace: baalvion-commerce, minReplicas: 2, maxReplicas: 10 }
