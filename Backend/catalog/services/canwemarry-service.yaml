apiVersion: baalvion.io/v1
kind: Service
metadata:
  name: canwemarry-service
  description: >-
    CanWeMarry — community support for people facing family or community opposition to
    their relationship or marriage. Owns support cases (with PUBLIC/COMMUNITY/PRIVATE
    visibility and per-participant consent), communities, discussion, the safety report
    queue, moderation actions and the outside-help resource directory. Identity stays
    with auth-service: this schema holds no credential and no contact detail.
  domain: ecosystem
  division: community
  context: canwemarry
  owner: "@baalvion/ecosystem"
  tier: tier-2
  repo: baalvion-platform
  path: Backend/services/ecosystem/canwemarry-service
spec:
  lifecycle: experimental
  language: node
  # Postgres only. No cache and no projection store yet — adding one before there is
  # traffic to justify it would be a second place for private case data to live.
  datastores: [postgres]
  dependsOn: [auth-service]
  consumesEvents: []
  producesEvents: []
  apis: ["/v1/cases", "/v1/communities", "/v1/posts", "/v1/comments", "/v1/resources", "/v1/moderation", "/v1/admin"]
  slo: { availability: 0.99, latencyP95Ms: 400 }
  deploy: { chart: baalvion-service, namespace: baalvion-ecosystem, minReplicas: 1, maxReplicas: 4 }
  # NOTE: no `runtime:` block. A parallel change adds contract C8 ("a service declares where
  # it answers") along with the schema property that permits it; until that lands, `runtime`
  # is an unknown key here and catalog validation rejects it. When C8 merges, this service
  # needs `runtime: { deployment: not-deployed }` adding back — it is not deployed anywhere.
