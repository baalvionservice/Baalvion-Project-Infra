apiVersion: baalvion.io/v1
kind: Service
metadata:
  name: crm-service
  description: >-
    CRM and marketing: VIP clients, segments, campaigns, vendors, affiliates, appointments. Brand-scoped (schema `crm`).
  domain: ecosystem
  division: commerce
  context: crm
  owner: "@baalvion/ecosystem"
  # tier derived from blast radius at registration — confirm with the owning team.
  tier: tier-2
  repo: baalvion-platform
  path: Backend/services/ecosystem/crm-service
spec:
  lifecycle: production
  language: node
  datastores: [postgres]
  dependsOn: [auth-service]
  consumesEvents: []
  producesEvents: []
  slo: { availability: 0.99, latencyP95Ms: 400 }
  deploy: { chart: baalvion-service, namespace: baalvion-ecosystem, minReplicas: 2, maxReplicas: 10 }
