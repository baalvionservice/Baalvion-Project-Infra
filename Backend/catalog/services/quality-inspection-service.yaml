apiVersion: baalvion.io/v1
kind: Service
metadata:
  name: quality-inspection-service
  description: >-
    GTOS quality and inspection: inspection orders, AQL sampling, defects, CAPA, certificate issuance.
  domain: commerce
  division: commerce
  context: trade-quality
  owner: "@baalvion/commerce"
  # tier derived from blast radius at registration — confirm with the owning team.
  tier: tier-2
  repo: baalvion-platform
  path: Backend/services/trade/quality-inspection-service
spec:
  lifecycle: production
  language: node
  datastores: [postgres]
  dependsOn: [auth-service]
  consumesEvents: []
  producesEvents: []
  slo: { availability: 0.99, latencyP95Ms: 400 }
  deploy: { chart: baalvion-service, namespace: baalvion-commerce, minReplicas: 2, maxReplicas: 10 }
