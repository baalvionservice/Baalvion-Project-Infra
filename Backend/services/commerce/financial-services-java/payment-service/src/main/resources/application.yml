spring:
  application:
    name: payment-service
    version: 1.0.0

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:baalvion}${DB_JDBC_PARAMS:}
    username: ${DB_APP_USER:${DB_USER:postgres}}
    password: ${DB_APP_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      # Send String params with an unspecified OID so Postgres casts them to the target
      # column type (notably String fields mapped onto jsonb columns). URL-independent, so it
      # also applies to the Testcontainers-provided JDBC URL in integration tests.
      data-source-properties:
        stringtype: unspecified
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 10000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      database: 0

  # RS256 verification source for app.security.enabled=true. Bind the central auth-service JWKS
  # (JWKS_URI) so the secured filter chain can validate user bearer tokens on /api/**. Gateway
  # webhooks stay public and server-to-server gateway calls use the internal secret, so this is
  # only needed for the (non-checkout) authenticated surface. issuer-uri intentionally omitted
  # (no OIDC discovery endpoint) — jwk-set-uri alone satisfies the secured chain.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OAUTH_JWK_SET_URI:${JWKS_URI:}}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      compression-type: snappy
      properties:
        linger.ms: 10
        batch.size: 32768
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      max-poll-records: 500

  sql:
    init:
      mode: always
      continue-on-error: true

  # Per-service Flyway history table — services share one DB, so isolate migration state.
  flyway:
    user: ${DB_MIGRATION_USER:${DB_USER:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}
    enabled: true
    table: flyway_history_payment

server:
  port: ${PORT:3015}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI/Swagger UI disabled by default — the PSP gateway exposes no public API docs surface. If
# springdoc is on the classpath, leaving it enabled would publish the internal payment endpoint schema
# (Caddy passes /v1/gateway/payments through). Re-enable explicitly in a non-prod profile if needed.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.baalvion: INFO
    org.springframework.web: INFO
    # Default to WARN: org.hibernate.SQL=DEBUG + BasicBinder=TRACE log every bound parameter (payment
    # amounts, provider refs, order metadata) to CloudWatch. Raise to DEBUG/TRACE only in a dev profile.
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

app:
  name: Baalvion Payment Service
  version: 1.0.0
  description: Payment processing with tiered fees for Global Trade Infrastructure
  # Kafka is OPTIONAL. Default true (full event-driven ledger saga). Set APP_KAFKA_ENABLED=false on
  # memory-constrained hosts to run WITHOUT Kafka/ZooKeeper: the Kafka producer/consumer/listener
  # wiring backs off, outbox rows stay durably PENDING, and the synchronous PSP gateway-checkout
  # vertical (/v1/gateway/**) — Razorpay/PayU/Stripe/Cashfree create, verify, capture, refund and
  # webhook handling — runs unaffected.
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
  vat-rate: 0.075
  daily-limit: 1000000
  transaction-min-limit: 100
  transaction-max-limit: 500000
  idempotency-ttl: 86400
  outbox:
    poll-ms: 2000
    batch-size: 100
    max-attempts: 10
  # Maker-checker (§7.1): reversals at/above this amount require a second approver.
  maker-checker:
    reversal-threshold: 100000
  # PSP gateway-checkout providers (Razorpay / Stripe / PayU). Secrets are injected at
  # deploy time via env vars — NEVER hardcoded. Mirrors the Node adapter credentials
  # (resolved there from the CMS vault). mock=true gives deterministic create/refund ids.
  psp:
    mock: ${PSP_MOCK:false}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
      replay-window-seconds: ${RAZORPAY_REPLAY_WINDOW_SECONDS:600}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      tolerance-seconds: ${STRIPE_TOLERANCE_SECONDS:300}
    payu:
      merchant-key: ${PAYU_MERCHANT_KEY:}
      merchant-salt: ${PAYU_MERCHANT_SALT:}
      base-url: ${PAYU_BASE_URL:https://secure.payu.in}
    # Crypto (USDT-TRC20 / ETH-BEP20 / BTC) — NON-CUSTODIAL. These are the merchant's OWN
    # public receiving addresses (never a private key), injected at deploy time like every
    # other provider credential above. No mock/live split beyond the shared app.psp.mock flag.
    # ETH-BEP20 = Binance-Peg Ethereum Token on BNB Smart Chain (BSC) — tracks ETH/USD, not a
    # stablecoin, so it goes through the same live rate lookup as BTC (see CryptoGateway).
    crypto:
      btc-address: ${BTC_ADDRESS:}
      usdt-trc20-address: ${USDT_TRC20_ADDRESS:}
      eth-bep20-address: ${ETH_BEP20_ADDRESS:}
      usdt-erc20-address: ${USDT_ERC20_ADDRESS:}
      usdc-erc20-address: ${USDC_ERC20_ADDRESS:}
      eth-address: ${ETH_ADDRESS:}
      bnb-address: ${BNB_ADDRESS:}
      usdt-bep20-address: ${USDT_BEP20_ADDRESS:}
      tron-grid-base-url: ${TRONGRID_BASE_URL:https://api.trongrid.io}
      usdt-trc20-contract-address: ${USDT_TRC20_CONTRACT_ADDRESS:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      mempool-base-url: ${MEMPOOL_BASE_URL:https://mempool.space/api}
      rate-api-base-url: ${RATE_API_BASE_URL:https://api.coingecko.com/api/v3}
      bsc-rpc-url: ${BSC_RPC_URL:https://bsc-dataseed.binance.org}
      eth-bep20-contract-address: ${ETH_BEP20_CONTRACT_ADDRESS:0x2170Ed0880ac9A755fd29B2688956BD959F933F8}
      usdt-bep20-contract-address: ${USDT_BEP20_CONTRACT_ADDRESS:0x55d398326f99059fF775485246999027B3197955}
      # No safe public default — public Ethereum RPCs throttle hard under real traffic.
      # Point this at a free-tier Alchemy/Infura/QuickNode endpoint before enabling ETH/
      # USDT-ERC20/USDC-ERC20 in production (see PspProperties.Crypto#ethRpcUrl javadoc).
      eth-rpc-url: ${ETH_RPC_URL:}
      usdt-erc20-contract-address: ${USDT_ERC20_CONTRACT_ADDRESS:0xdAC17F958D2ee523a2206206994597C13D831ec7}
      usdc-erc20-contract-address: ${USDC_ERC20_CONTRACT_ADDRESS:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48}
      # Native ETH/BNB detection uses an Etherscan/BscScan-compatible "account tx list" API
      # rather than eth_getLogs (native transfers emit no event log) — see EvmNativeVerifier
      # javadoc in CryptoGateway. Both need a free-tier API key to function.
      etherscan-api-base-url: ${ETHERSCAN_API_BASE_URL:https://api.etherscan.io/api}
      etherscan-api-key: ${ETHERSCAN_API_KEY:}
      bscscan-api-base-url: ${BSCSCAN_API_BASE_URL:https://api.bscscan.com/api}
      bscscan-api-key: ${BSCSCAN_API_KEY:}
      btc-confirmations-required: ${BTC_CONFIRMATIONS_REQUIRED:3}
      bsc-confirmations-required: ${BSC_CONFIRMATIONS_REQUIRED:15}
      eth-confirmations-required: ${ETH_CONFIRMATIONS_REQUIRED:12}
      charge-expiry-minutes: ${CRYPTO_CHARGE_EXPIRY_MINUTES:60}

# CMS "Integrations & Keys" vault — source of PER-TENANT PSP provider keys (per website slug).
# When base-url is blank the resolver stays GLOBAL (app.psp.* env keys) for single-tenant deploys.
# Secrets injected at deploy time via env vars — NEVER hardcoded. Mirrors the Node SDK contract:
#   GET {base-url}/internal/integrations/{slug}  with header x-internal-secret.
cms:
  base-url: ${CMS_BASE_URL:}
  internal-secret: ${INTERNAL_SERVICE_SECRET:}

# Resilience4j on the external scheme boundary (design §9.1)
resilience4j:
  circuitbreaker:
    instances:
      scheme:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      scheme:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  bulkhead:
    instances:
      scheme:
        max-concurrent-calls: 50
        max-wait-duration: 100ms
  timelimiter:
    instances:
      scheme:
        timeout-duration: 30s        # external scheme calls must complete within 30s (§9.1)
        cancel-running-future: true

---
# Dev-only verbosity: surface exception/binding detail on the /error whitebox ONLY under the `dev`
# profile (SPRING_PROFILES_ACTIVE=dev). Never enabled in the default/prod configuration above —
# stack traces / exception messages must not leak to payment-service API clients in prod.
spring:
  config:
    activate:
      on-profile: dev

server:
  error:
    include-message: always
    include-binding-errors: always
