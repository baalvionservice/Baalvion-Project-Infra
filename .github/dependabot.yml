version: 2
updates:
  # ── JavaScript / TypeScript workspace (pnpm monorepo root) ──────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # ── Docker base images ────────────────────────────────────────────────────
  # `directory: "/"` watched the repo root, which has no Dockerfile — so none of the
  # 66 Dockerfile directories was ever scanned and Dependabot has never opened a single
  # build(deps) PR. Base images have gone unpatched since the config was written.
  # These seven globs cover all 66. Grouped into one PR: ungrouped, 66 directories
  # would open 66.
  - package-ecosystem: "docker"
    directories:
      - "/Backend/services/*/*"
      - "/Backend/services/ecosystem/law-elite/gateway"
      - "/Backend/services/ecosystem/law-elite/services/*"
      - "/Backend/gateway"
      - "/Frontend/*"
      - "/deploy/consolidated"
      - "/deploy/consolidated/nodebb"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-base-images:
        patterns: ["*"]

  # ── Java / Spring Boot (financial services) ─────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/Backend/services/commerce/financial-services-java"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
