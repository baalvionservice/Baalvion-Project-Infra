name: 'Slack Notify'
description: 'Posts a formatted CI/security/deploy status message to a Slack Incoming Webhook. Silently no-ops if the webhook secret is unset, so a channel that has not been configured yet never breaks a workflow.'

inputs:
  webhook-url:
    description: 'Slack Incoming Webhook URL — always pass via ${{ secrets.* }}, never a literal URL.'
    required: true
  status:
    description: 'success | failure'
    required: true
  title:
    description: 'Headline for the message, e.g. "CI Pipeline" or "Deploy — consolidated backend".'
    required: true
  details:
    description: 'Optional extra Markdown line (failing job names, alert counts, smoke-test results, ...).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Post to Slack
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        DETAILS: ${{ inputs.details }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        if [ -z "${WEBHOOK_URL:-}" ]; then
          echo "::warning::Slack webhook secret is empty — skipping notification. Add the secret in repo Settings > Secrets and variables > Actions."
          exit 0
        fi

        if [ "$STATUS" = "success" ]; then
          COLOR="#2eb886"
          EMOJI=":white_check_mark:"
        else
          COLOR="#e01e5a"
          EMOJI=":rotating_light:"
        fi

        SHORT_SHA="${SHA:0:7}"

        PAYLOAD=$(jq -n \
          --arg color "$COLOR" \
          --arg emoji "$EMOJI" \
          --arg title "$TITLE" \
          --arg status "$(echo "$STATUS" | tr '[:lower:]' '[:upper:]')" \
          --arg repo "$REPO" \
          --arg branch "$BRANCH" \
          --arg actor "$ACTOR" \
          --arg event "$EVENT" \
          --arg sha "$SHORT_SHA" \
          --arg run_url "$RUN_URL" \
          --arg details "$DETAILS" \
          '{
            attachments: [{
              color: $color,
              blocks: (
                [
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: ($emoji + " *" + $title + "* — " + $status) }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Repo:*\n" + $repo) },
                      { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                      { type: "mrkdwn", text: ("*Commit:*\n" + $sha) },
                      { type: "mrkdwn", text: ("*Triggered by:*\n" + $actor + " (" + $event + ")") }
                    ]
                  }
                ]
                + (if ($details | length) > 0 then
                    [{ type: "section", text: { type: "mrkdwn", text: $details } }]
                  else [] end)
                + [
                  {
                    type: "actions",
                    elements: [{
                      type: "button",
                      text: { type: "plain_text", text: "View run" },
                      url: $run_url
                    }]
                  }
                ]
              )
            }]
          }')

        curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL" >/dev/null
