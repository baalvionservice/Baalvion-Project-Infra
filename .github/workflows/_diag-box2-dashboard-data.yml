name: (temp) Diagnose box2 dashboard empty-data issue

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Mint a diagnostic token for the real super_admin and hit the dashboard APIs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/baalvion-box2
            echo "===== find the real super_admin user (migrated from box1) ====="
            docker exec -w /app/Backend/services/identity/auth-service consolidated-app-identity-1 node -e "
              const db = require('./models');
              db.sequelize.query(\"select u.id, u.email, tm.org_id, tm.role from auth.users u join auth.team_members tm on tm.user_id = u.id where tm.role = 'super_admin' limit 3\", {type: db.sequelize.QueryTypes.SELECT})
                .then(rows => { console.log(JSON.stringify(rows, null, 2)); process.exit(0); })
                .catch(e => { console.log('QUERY ERROR:', e.message); process.exit(1); });
            "
            echo "===== mint token via the real jwtRsa signer + call admin/stats ====="
            docker exec -w /app/Backend/services/identity/auth-service consolidated-app-identity-1 node -e "
              const db = require('./models');
              const { signAccessToken } = require('./utils/jwtRsa');
              const http = require('http');
              (async () => {
                const [user] = await db.sequelize.query(
                  \"select u.id, u.email, tm.org_id from auth.users u join auth.team_members tm on tm.user_id = u.id where tm.role = 'super_admin' limit 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                if (!user) { console.log('NO SUPER_ADMIN FOUND'); process.exit(1); }
                console.log('using user:', user.email, user.id, user.org_id);
                const token = signAccessToken({ sub: user.id, email: user.email, orgId: user.org_id, role: 'super_admin', permissions: [], sid: null });
                const call = (host, port, path) => new Promise((resolve) => {
                  http.get({ host, port, path, headers: { Authorization: 'Bearer ' + token } }, (r) => {
                    let d=''; r.on('data', c=>d+=c); r.on('end', ()=>resolve({status:r.statusCode, body:d.slice(0,600)}));
                  }).on('error', e=>resolve({status:'ERR', body:e.message}));
                });
                console.log('admin/stats (app-platform:3021) ->', JSON.stringify(await call('app-platform', 3021, '/v1/admin/stats')));
                console.log('cms/websites (app-platform:3018) ->', JSON.stringify(await call('app-platform', 3018, '/api/v1/cms/websites')));
                console.log('cms/integrations/summary (app-platform:3018) ->', JSON.stringify(await call('app-platform', 3018, '/api/v1/cms/integrations/summary')));
              })().catch(e=>{console.log('SCRIPT ERROR:', e.message); process.exit(1);});
            "
      - name: Retry with a real, existing session id
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -uo pipefail
            docker exec -w /app/Backend/services/identity/auth-service consolidated-app-identity-1 node -e "
              const db = require('./models');
              const { signAccessToken } = require('./utils/jwtRsa');
              const http = require('http');
              (async () => {
                const [user] = await db.sequelize.query(
                  \"select u.id, u.email, tm.org_id from auth.users u join auth.team_members tm on tm.user_id = u.id where tm.role = 'super_admin' limit 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                const [session] = await db.sequelize.query(
                  \"select id from auth.sessions where user_id = \" + user.id + \" order by created_at desc limit 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                console.log('user:', user.email, user.id, 'session:', session ? session.id : 'NONE FOUND');
                if (!session) { console.log('NO SESSION ROW EXISTS FOR THIS USER'); process.exit(1); }
                const token = signAccessToken({ sub: user.id, email: user.email, orgId: user.org_id, role: 'super_admin', permissions: [], sid: session.id });
                const call = (host, port, path) => new Promise((resolve) => {
                  http.get({ host, port, path, headers: { Authorization: 'Bearer ' + token } }, (r) => {
                    let d=''; r.on('data', c=>d+=c); r.on('end', ()=>resolve({status:r.statusCode, body:d.slice(0,800)}));
                  }).on('error', e=>resolve({status:'ERR', body:e.message}));
                });
                console.log('admin/stats ->', JSON.stringify(await call('app-platform', 3021, '/v1/admin/stats')));
                console.log('cms/websites ->', JSON.stringify(await call('app-platform', 3018, '/api/v1/cms/websites')));
                console.log('cms/integrations/summary ->', JSON.stringify(await call('app-platform', 3018, '/api/v1/cms/integrations/summary')));
              })().catch(e=>{console.log('SCRIPT ERROR:', e.message); process.exit(1);});
            "
      - name: Mint token to a file on box2 (avoid log masking), scp it out, test via runner
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CORE2_EC2_SSH_KEY }}" > ~/.ssh/box2_key
          chmod 600 ~/.ssh/box2_key
          ssh-keyscan -H "${{ secrets.CORE2_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" '
            set -euo pipefail
            docker exec -w /app/Backend/services/identity/auth-service consolidated-app-identity-1 node -e "
              const db = require(\"./models\");
              const { signAccessToken } = require(\"./utils/jwtRsa\");
              (async () => {
                const [user] = await db.sequelize.query(
                  \"select u.id, u.email, tm.org_id from auth.users u join auth.team_members tm on tm.user_id = u.id where tm.role = \x27super_admin\x27 limit 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                const [session] = await db.sequelize.query(
                  \"select id from auth.sessions where user_id = \" + user.id + \" order by created_at desc limit 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                process.stdout.write(signAccessToken({ sub: user.id, email: user.email, orgId: user.org_id, role: \"super_admin\", permissions: [], sid: session.id }));
              })();
            " > /tmp/diag_token.txt
          '
          scp -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}:/tmp/diag_token.txt" ./diag_token.txt
          echo "token bytes: $(wc -c < ./diag_token.txt)"
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" "rm -f /tmp/diag_token.txt" || true

      - name: Upload token as artifact (not subject to log masking)
        uses: actions/upload-artifact@v4
        with:
          name: diag-token
          path: diag_token.txt
          retention-days: 1

  caddy-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check box2 Caddyfile routing for the cms/knowledge path
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail
            cd /opt/baalvion-box2
            echo "===== grep for cms / knowledge routes in Caddyfile ====="
            grep -n -B2 -A6 "knowledge\|cms-service\|/cms" deploy/consolidated/caddy/Caddyfile

  org-membership-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: List ALL org memberships for the super_admin user + which org owns the websites
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail
            docker exec -w /app/Backend/services/identity/auth-service consolidated-app-identity-1 node -e "
              const db = require('./models');
              (async () => {
                const memberships = await db.sequelize.query(
                  \"select tm.org_id, tm.role, o.name from auth.team_members tm left join auth.organizations o on o.id = tm.org_id where tm.user_id = 1\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                console.log('ALL memberships for user 1:', JSON.stringify(memberships, null, 2));
                const websiteOrgs = await db.sequelize.query(
                  \"select distinct organization_id, count(*) from cms.cms_websites group by organization_id\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                console.log('org(s) that own cms_websites rows:', JSON.stringify(websiteOrgs, null, 2));
                const sessions = await db.sequelize.query(
                  \"select id, org_id, created_at from auth.sessions where user_id = 1 order by created_at desc limit 5\",
                  { type: db.sequelize.QueryTypes.SELECT }
                );
                console.log('recent real sessions (org_id used at real login):', JSON.stringify(sessions, null, 2));
              })().catch(e=>{console.log('ERROR:', e.message); process.exit(1);});
            "

  box2-full-inventory:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: List every container running on box2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            set -uo pipefail
            echo "===== all containers on box2 ====="
            docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "===== nodebb/community/tor mentions in box2's compose file ====="
            grep -n "nodebb\|community\|tor-bridge" /opt/baalvion-box2/deploy/consolidated/docker-compose.prod.yml 2>&1 | head -20
