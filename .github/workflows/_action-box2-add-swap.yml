name: (temp) Add 2GB swap safety net to box2

on:
  workflow_dispatch: {}

jobs:
  add-swap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create + enable 2GB swap file (idempotent, persisted in fstab)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail

            if swapon --show | grep -q '/swapfile'; then
              echo "swap already active, skipping creation"
            else
              echo "===== creating 2GB swap file ====="
              sudo -n fallocate -l 2G /swapfile
              sudo -n chmod 600 /swapfile
              sudo -n mkswap /swapfile
              sudo -n swapon /swapfile
              grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo -n tee -a /etc/fstab

              echo "===== tune swappiness down (prefer RAM, use swap only as overflow) ====="
              sudo -n sysctl vm.swappiness=10
              grep -q '^vm.swappiness' /etc/sysctl.conf 2>/dev/null || echo 'vm.swappiness=10' | sudo -n tee -a /etc/sysctl.conf
            fi

            echo
            echo "===== final state ====="
            swapon --show
            free -h
