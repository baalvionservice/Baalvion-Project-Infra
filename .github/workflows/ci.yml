# ─────────────────────────────────────────────────────────────────────────────
# CI is build + scan ONLY. It never pushes images and never deploys.
#
# deploy.yml — the 19-service pipeline this header used to name — was deleted
# 2026-07-02. Two workflows ship to production now:
#   • deploy-consolidated-box2.yml  — box2, the only live target (workflow_dispatch)
#   • community-giftcard-deploy.yml — the only push-triggered deploy
#
# Image names referenced here are kept in sync with those two workflows' ECR repos
# so a CI-scanned artifact maps 1:1 to a shipped image. The image set below is a
# representative SUBSET of the fleet, not all of it.
# ─────────────────────────────────────────────────────────────────────────────
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  TRIVY_SEVERITY: 'CRITICAL'
  GO_VERSION: '1.25'
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=${{ github.workspace }}/.m2/repository'
  # Shared Turbo build cache. Unset secrets simply mean turbo falls back to its
  # local cache, so this is safe to leave in place before the secrets exist.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

# Least-privilege default token; jobs that need more must opt in explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes and speed feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs before anything installs. Root `pnpm.overrides` and the lockfile's
  # `overrides:` block must agree or EVERY job's `pnpm install --frozen-lockfile`
  # dies with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH before running a single test —
  # which is exactly how Dependabot PRs kept landing red (it bumps the leaf
  # package.json files and the lockfile, but not the root overrides block).
  # Pure Node, no install needed, so it reports the real cause in ~10s.
  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check pnpm overrides are in sync
        run: node scripts/check-lockfile-overrides.mjs

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # affected-package resolution needs history, not a shallow clone

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      # Shared @baalvion/* packages publish their types from a gitignored dist/
      # (tsup output). Build them before any typecheck/lint that imports them.
      - name: Build Workspace Packages
        run: pnpm --filter "./Backend/packages/*" run build

      # Lint every workspace package that has a lint script, and fail only where the
      # error count went UP against .lint-baseline.json.
      #
      # This replaces a two-app --filter allow-list. A hardcoded list has to be edited
      # for every new app, so in practice it never was: thirteen apps had no ESLint
      # config at all and nobody noticed, because `next lint` silently supplied
      # defaults and nothing else ran. Discovery is now by convention — a package.json
      # with a `lint` script gets linted — so a new app is covered with no CI change,
      # starts at a baseline of zero, and a package whose lint cannot run FAILS rather
      # than quietly passing.
      #
      # Existing debt is frozen and can only shrink. After fixing errors, run
      # `node scripts/lint-ratchet.mjs --update` to lower the floor permanently.
      # PR-scoped: only what this diff can have broken. On a push to main BASE_REF is
      # empty and the full set runs, so merges still prove everything. affected.mjs
      # fails safe — an unresolvable graph selects every package.
      - name: Resolve affected packages
        id: affected
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "${BASE_REF:-}" ]; then
            node scripts/affected.mjs --base "$BASE_REF" --dirs > /tmp/affected.txt
            echo "scope=$(node scripts/affected.mjs --base "$BASE_REF" --count)" >> "$GITHUB_OUTPUT"
            echo "only=--only /tmp/affected.txt" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full sweep (push)" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice title=Gate scope::$(cat "$GITHUB_OUTPUT" | grep ^scope= | cut -d= -f2-)"

      - name: Run ESLint (ratchet)
        run: node scripts/lint-ratchet.mjs ${{ steps.affected.outputs.only }}

      - name: TypeScript Typecheck
        run: |
          pnpm exec tsc --noEmit --project Backend/packages/sdk/tsconfig.json
          for dir in Frontend/*/; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Typechecking $dir..."
              pnpm exec tsc --noEmit --project "$dir/tsconfig.json" || exit 1
            fi
          done

  backend-go:
    name: Backend Go (Gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Track the module's declared toolchain (go 1.25.0) so coverage
          # instrumentation (`covdata`) matches; a 1.22 pin broke `go test`.
          go-version-file: Backend/gateway/go.mod
          
      - name: Cache Go Modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('Backend/gateway/go.sum', 'Backend/packages/**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
            
      - name: Install Dependencies
        run: go mod download
        working-directory: Backend/gateway
        
      - name: Run Tests
        run: go test ./... -v -coverprofile=coverage.out
        working-directory: Backend/gateway
        
      - name: Build Gateway
        run: go build -o bin/gateway ./cmd/gateway
        working-directory: Backend/gateway

  backend-java:
    name: Backend Java (Financial Services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven Repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            .m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('Backend/services/commerce/financial-services-java/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-java-maven-
            
      - name: Run Tests & Build
        run: mvn clean verify -DskipTests=false
        working-directory: Backend/services/commerce/financial-services-java

  # Matrix inputs must be known at workflow setup — they cannot reference a
  # same-job `steps.*` output (that was the pre-existing startup_failure). So a
  # dedicated job discovers the frontend dirs and exposes them as a JSON output.
  # Which apps a PR can actually have broken. Turbo owns the dependency graph, so a
  # change to a shared package correctly fans out to every consumer (verified: one app
  # -> 1 package, @baalvion/design -> 23). On a push to main the base is empty, so the
  # full fleet builds — PRs stay fast, merges still prove everything.
  discover-frontends:
    name: Discover Frontend Apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dirs: ${{ steps.extract-apps.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the affected diff needs history, not a shallow clone
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract App Directories from Config
        id: extract-apps
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          # Only include apps whose package.json is present in this checkout — a
          # guard so a missing app dir can't make the build step fall through to a
          # root `pnpm run build` that builds the entire monorepo.
          ALL=$(node -p "JSON.stringify(require('./frontends.config.js').apps.map(a => a.cwd.replace('D:/Baalvion Projects/Frontend/', '')).filter(d => require('fs').existsSync('Frontend/' + d + '/package.json')))")
          if [ -z "${BASE_REF:-}" ]; then
            echo "push/main build — every app"
            echo "dirs=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Intersect the configured app list with what the diff affects. affected.mjs
          # fails SAFE: an unknown ref or any turbo error returns every package, so a
          # narrowing failure over-builds rather than skipping a broken app.
          AFF=$(node scripts/affected.mjs --base "$BASE_REF" --dirs | sed 's|^Frontend/||')
          DIRS=$(ALL="$ALL" AFF="$AFF" node -e '
            const all=JSON.parse(process.env.ALL);
            const aff=new Set(process.env.AFF.split("\n").filter(Boolean));
            console.log(JSON.stringify(all.filter(d=>aff.has(d))));
          ')
          echo "affected apps: $DIRS"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

  frontend-build:
    name: Frontend Apps Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover-frontends
    # A docs-only or backend-only PR affects no app; an empty matrix is a hard error
    # in Actions, so skip the job rather than fail it.
    if: needs.discover-frontends.outputs.dirs != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover-frontends.outputs.dirs) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Install at the workspace root so `workspace:*` deps link, not per-app.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Build the shared @baalvion/* packages (gitignored tsup dist/) the apps
      # import, otherwise `next build` type-check fails to resolve them.
      - name: Build Workspace Packages
        run: pnpm --filter "./Backend/packages/*" run build

      - name: Determine Build Command
        id: build-cmd
        run: |
          if grep -q '"next"' Frontend/${{ matrix.app }}/package.json; then
            echo "cmd=exec next build" >> $GITHUB_OUTPUT
          elif grep -q '"vite"' Frontend/${{ matrix.app }}/package.json; then
            echo "cmd=exec vite build" >> $GITHUB_OUTPUT
          else
            echo "cmd=run build" >> $GITHUB_OUTPUT
          fi

      - name: Build App
        run: pnpm ${{ steps.build-cmd.outputs.cmd }}
        working-directory: Frontend/${{ matrix.app }}
        env:
          # This job compiles each app to prove it builds; the artifact is never deployed
          # (Vercel builds its own from source). CanWeMarry refuses an unset SITE_URL because
          # a real deploy would bake localhost canonicals into its prerendered pages — and the
          # escape hatch its own error names is exactly this case. Apps that do not read the
          # flag are unaffected.
          ALLOW_LOCALHOST_ORIGIN: '1'
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ matrix.app }}-dist
          path: Frontend/${{ matrix.app }}/dist
          retention-days: 5

  security-cross-tenant:
    name: Security — Cross-Tenant RLS (R1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baalvion_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: baalvion_db
      PGPASSWORD: postgres
      # appConfig.js calls requireEnv('JWT_ACCESS_SECRET') at load time (pulled in
      # transitively by migrate.js -> models -> appConfig). Dummy value: this job
      # only runs migrations + an RLS probe, it never mints real tokens.
      JWT_ACCESS_SECRET: ci-dummy-access-secret-not-used-for-real-auth
    steps:
      - uses: actions/checkout@v7
      # trade-service is a regular folder in this repo (vendored from its former
      # submodule), so the normal checkout already includes it.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # trade-service declares @baalvion/auth-node as a pnpm `workspace:*` dep,
      # which npm cannot resolve in a standalone submodule checkout
      # (EUNSUPPORTEDPROTOCOL). migrate.js and the RLS probe don't use it, so
      # strip workspace-only deps and install the rest (pg, sequelize, …) with npm.
      - name: Install trade-service dependencies
        working-directory: Backend/services/commerce/trade-service
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const f of ['dependencies','devDependencies','optionalDependencies']){if(!p[f])continue;for(const k of Object.keys(p[f]))if(String(p[f][k]).startsWith('workspace:'))delete p[f][k];}fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npm install --no-package-lock --legacy-peer-deps
      # migrate.js -> models -> config/appConfig requires @baalvion/auth-node
      # (plain JS, main index.js, only needs jsonwebtoken which npm just installed).
      # Link it from the parent monorepo checkout so node can resolve the
      # workspace package we stripped above.
      - name: Link @baalvion/auth-node from the monorepo
        working-directory: Backend/services/commerce/trade-service
        run: |
          mkdir -p node_modules/@baalvion
          ln -sfn "$GITHUB_WORKSPACE/Backend/packages/auth-node" node_modules/@baalvion/auth-node
      - name: Create baalvion_app role (027)
        run: psql "postgresql://postgres:postgres@localhost:5432/baalvion_db" -v app_pw=ci_app_pw -f Backend/database/migrations/027_app_role.sql
      - name: Apply trade-service migrations (owner role)
        # --preserve-symlinks so the symlinked @baalvion/auth-node resolves its
        # own deps (jsonwebtoken) from trade-service/node_modules where npm put them.
        run: DB_USER=postgres DB_PASSWORD=postgres node --preserve-symlinks migrate.js
        working-directory: Backend/services/commerce/trade-service
      - name: Grant baalvion_app on freshly-created tables (027 re-run for defaults)
        run: psql "postgresql://postgres:postgres@localhost:5432/baalvion_db" -v app_pw=ci_app_pw -f Backend/database/migrations/027_app_role.sql
      - name: Run cross-tenant RLS probe (as baalvion_app)
        run: BAALVION_APP_PASSWORD=ci_app_pw node --test tests/rls-cross-tenant.test.mjs
        working-directory: Backend/services/commerce/trade-service

  # Static, DB-free guardrail: every tenant-scoped table (a table with a
  # tenant_id / org_id / organization_id column) across ALL services must ship
  # ENABLE + FORCE ROW LEVEL SECURITY + a tenant-isolation policy. A new tenant
  # table without RLS is a silent cross-tenant leak — this fails the build on it.
  tenant-rls-audit:
    name: Security — Tenant RLS Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # trade-service is a regular folder in this repo (vendored from its former
      # submodule); its migrations come with the normal checkout and are part of
      # the coverage set.
      - name: Static tenant-isolation audit (fail-closed RLS on every tenant table)
        run: node Backend/scripts/tenant-isolation-audit.mjs
      - name: Audit guard + RLS SQL builder unit tests
        run: node --test Backend/scripts/tenant-isolation-audit.test.mjs Backend/packages/tenancy/test.smoke.js

  # Live proof on a real Postgres that the canonical enableRlsSql() policy (the
  # exact text every per-service RLS migration is generated from) fail-closed
  # isolates tenants and that the CR-8 bypass hardening holds for baalvion_app.
  tenant-rls-live:
    name: Security — Tenant RLS Live Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baalvion_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create baalvion_app role (027)
        run: psql "postgresql://postgres:postgres@localhost:5432/baalvion_db" -v app_pw=ci_app_pw -f Backend/database/migrations/027_app_role.sql
      # The tenancy package does not declare pg (it ships only policy-builder SQL);
      # the live probe needs a driver. Install it out-of-band so the lockfile and
      # the package's dependency surface stay untouched.
      - name: Install pg for the probe
        working-directory: Backend/packages/tenancy
        run: npm install pg --no-save --no-audit --no-fund
      - name: Run live RLS isolation probe (as baalvion_app)
        working-directory: Backend/packages/tenancy
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: baalvion_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          BAALVION_APP_USER: baalvion_app
          BAALVION_APP_PASSWORD: ci_app_pw
        run: node --test tests/rls-live.test.mjs

  # A real cross-service test. The previous body was an `echo` saying no harness existed,
  # sitting inside the REQUIRED ci-success gate — a green check that proved nothing.
  #
  # Two services in two processes: auth-service registers a user and mints an RS256 token,
  # crm-service verifies it via @baalvion/auth-node by fetching auth-service's JWKS over
  # HTTP, then serves an authenticated write and read back.
  #
  # crm-service gets a DECOY JWT_PUBLIC_KEY deliberately. auth-node falls back to the static
  # key whenever the JWKS path errors, so handing it the real key would let this pass with
  # auth-service dead. With a decoy, the JWKS hop is the only thing that can produce a 2xx —
  # verified by pointing BAALVION_JWKS_URI at a dead port, which turns the suite red.
  integration-test:
    name: Integration Tests
    needs: [backend-go, backend-java, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baalvion_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: baalvion_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: 'false'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      # NOT production: config/vault.js hard-throws when NODE_ENV=production and the RSA keys
      # are not provisioned from a secret store.
      NODE_ENV: development
      JWT_ISSUER: baalvion-auth
      JWT_AUDIENCE: baalvion-platform
      # auth-service defaults to 20 requests/min per IP, which the suite would trip.
      RATE_LIMIT_IP_MAX: '5000'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Workspace Packages
        run: pnpm --filter "./Backend/packages/*" run build
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # One keypair both sides agree on — the same script backend-quality.yml and local dev use.
      - name: Generate the shared RS256 keypair
        run: node scripts/gen-dev-jwt-keys.mjs
      - name: Emit the decoy public key
        run: node scripts/ci/integration-identity-crm.mjs --emit-decoy "$RUNNER_TEMP"
      # 17 chained psql files, all IF NOT EXISTS. crm-service needs no migrations — it
      # creates its own schema with sync({alter:false}) at boot.
      - name: Apply auth-service migrations
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/baalvion_db \
            npm --prefix Backend/services/identity/auth-service run migrate
      # Background processes survive between steps on the runner (same pattern as
      # backend-quality.yml's live-integration job). smoke-check.mjs rather than a bare curl
      # loop so a service that never comes up fails the step instead of falling through.
      - name: Start auth-service (:3001)
        working-directory: Backend/services/identity/auth-service
        env:
          PORT: '3001'
          REENGAGEMENT_CRON_ENABLED: 'false'
        run: |
          JWT_PRIVATE_KEY_PATH="$GITHUB_WORKSPACE/docker/secrets/jwt_private_key.pem" \
          JWT_PUBLIC_KEY_PATH="$GITHUB_WORKSPACE/docker/secrets/jwt_public_key.pem" \
            node index.js > "$RUNNER_TEMP/auth-service.log" 2>&1 &
          node "$GITHUB_WORKSPACE/scripts/smoke-check.mjs" \
            http://127.0.0.1:3001/health http://127.0.0.1:3001/.well-known/jwks.json \
            --retries 30 --delay 2000 --timeout 5000
      - name: Start crm-service (:3063)
        working-directory: Backend/services/ecosystem/crm-service
        env:
          PORT: '3063'
          BAALVION_JWKS_URI: http://127.0.0.1:3001/.well-known/jwks.json
        run: |
          JWT_PUBLIC_KEY="$(cat "$RUNNER_TEMP/decoy_public.pem")" \
            node index.js > "$RUNNER_TEMP/crm-service.log" 2>&1 &
          node "$GITHUB_WORKSPACE/scripts/smoke-check.mjs" http://127.0.0.1:3063/health \
            --retries 30 --delay 2000 --timeout 5000
      - name: Cross-service auth + CRM round trip
        run: node scripts/ci/integration-identity-crm.mjs
      - name: Service logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP/auth-service.log" "$RUNNER_TEMP/crm-service.log"; do
            echo "::group::$(basename "$f")"
            tail -n 200 "$f" || echo "(no log)"
            echo "::endgroup::"
          done

  # Runs EVERY workspace package's tests, whatever runner it uses.
  #
  # The old gate ran two selections: Backend/packages via a --filter, and, for
  # services, ONLY those whose test script is literally `node --test`. jest and
  # vitest services were "deliberately excluded until their runners are wired" and
  # never were — so 213 test files across 13 packages never executed on any merge,
  # including auth-service (19 files) and order-execution-service (46). Engineers
  # wrote them; CI ignored them; merging proved nothing about any of it.
  #
  # They were not excluded for failing: auth-service runs 230 tests with 205
  # passing locally, and its only failures are ECONNREFUSED from tests that want
  # the Postgres this job now provides.
  #
  # Discovery is by convention (a real `test` script), so a new service is covered
  # with no CI change. Known-failing packages are frozen by .test-baseline.json and
  # cannot grow; a package with no baseline entry is expected to PASS.
  all-package-tests:
    name: All Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baalvion_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: baalvion_test
      DB_USER: baalvion
      DB_PASSWORD: baalvion_dev_pass
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-dummy-access-secret-not-used-for-real-auth
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-not-used-for-real-auth
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # affected-package resolution needs history
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Workspace Packages
        run: pnpm --filter "./Backend/packages/*" run build
      # Several suites expect this role/database rather than the default postgres one.
      - name: Provision the test role and database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE baalvion LOGIN PASSWORD 'baalvion_dev_pass' SUPERUSER;" || true
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE baalvion_test OWNER baalvion;" || true
      # PR-scoped: only what this diff can have broken. On a push to main BASE_REF is
      # empty and the full set runs, so merges still prove everything. affected.mjs
      # fails safe — an unresolvable graph selects every package.
      - name: Resolve affected packages
        id: affected
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "${BASE_REF:-}" ]; then
            node scripts/affected.mjs --base "$BASE_REF" --dirs > /tmp/affected.txt
            echo "scope=$(node scripts/affected.mjs --base "$BASE_REF" --count)" >> "$GITHUB_OUTPUT"
            echo "only=--only /tmp/affected.txt" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full sweep (push)" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice title=Gate scope::$(cat "$GITHUB_OUTPUT" | grep ^scope= | cut -d= -f2-)"

      - name: Run every package's tests
        run: node scripts/test-all.mjs ${{ steps.affected.outputs.only }}

  node-package-tests:
    name: Node Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Workspace Packages
        run: pnpm --filter "./Backend/packages/*" run build
      # Runs each shared package's own test script (jest + node:test). @baalvion/upload
      # enforces a coverage threshold via its jest config — the gate to roll out per package
      # toward the 80% workspace target. Blocking: a failing or below-threshold package fails CI.
      - name: Run Package Tests (with coverage gates)
        run: pnpm --filter "./Backend/packages/*" run test

  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational for now: surfaces Dockerfile issues without blocking (existing lint debt).
    # Promote into ci-success once the findings are burned down.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint all Dockerfiles (report-only)
        run: |
          find Backend Frontend -name Dockerfile \
            -not -path "*/node_modules/*" \
            -not -path "*/trade-service/*" | while read -r df; do
            echo "::group::$df"
            docker run --rm -i hadolint/hadolint hadolint --no-fail - < "$df" || true
            echo "::endgroup::"
          done

  deploy-compose-validate:
    name: Deploy Compose Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate deploy docker-compose files
        run: |
          set -e
          for dir in deploy/*/; do
            compose="${dir}docker-compose.prod.yml"
            envfile="${dir}.env.prod.example"
            [ -f "$compose" ] || continue
            echo "Validating $compose"
            if [ -f "$envfile" ]; then
              docker compose --env-file "$envfile" -f "$compose" config -q
            else
              docker compose -f "$compose" config -q
            fi
          done

  # Build the production service images and scan them with Trivy. The scan STEP
  # fails (exit-code 1) on any fixable HIGH or CRITICAL OS/library CVE. Scope = a
  # representative SUBSET of the production fleet (repo-root context + `turbo
  # prune`, mirroring the deploy-consolidated-box2.yml build). Matrix `name`s mirror
  # the ECR repo names so each scanned artifact maps 1:1 to the pushed image. This
  # job NEVER pushes — deploy-consolidated-box2.yml and community-giftcard-deploy.yml
  # are the only paths to ECR/EC2. Extend
  # the matrix as more Dockerfiles are build-verified (same pattern as the
  # frontend/eslint allow-list above).
  #
  # continue-on-error (informational, like dockerfile-lint): the gate is live and
  # red-on-findings, but does not yet block merges. It surfaced real pre-existing
  # image CVEs (turbo-prune ships some transitive deps un-pinned vs the root
  # pnpm.overrides; plus base-image OS CVEs). Promote into ci-success (add it to the
  # needs list + drop continue-on-error) once those are burned down — see
  # docs/RUNBOOK or the cert report's burn-down list.
  # The Docker scan matrix, discovered from the repo instead of hand-listed.
  # The old matrix named eight services while the repo holds 60 buildable images —
  # the other 52 were never built in CI and never CVE-scanned, and nothing said so,
  # because a hardcoded matrix cannot report what it omits.
  #
  # --changed narrows to images a diff can actually have broken; a change to the
  # shared packages, lockfile, turbo.json or root manifest fans out to everything.
  # An unknown base ref falls back to building ALL rather than silently zero.
  discover-images:
    name: Discover Service Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # --changed needs history to diff against the base ref
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fail on duplicate image names
        run: node scripts/discover-images.mjs --check
      - id: find
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}"
          M=$(node scripts/discover-images.mjs --changed "$BASE" --matrix)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$M" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).include.length))')" >> "$GITHUB_OUTPUT"

  docker-build-scan:
    name: Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover-images
    if: needs.discover-images.outputs.count != '0'
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-images.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build locally (load into the runner's docker, do NOT push) so Trivy scans the
      # exact artifact CI produced. Repo-root context: the Dockerfile runs `turbo prune`
      # over the pnpm workspace. GHA layer cache keeps re-runs fast.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: baalvion/${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

      # Image vulnerability scan. Fails the job (exit-code 1) on any FIXABLE HIGH or
      # CRITICAL OS/library CVE. `ignore-unfixed: true` keeps the gate actionable — it
      # does not block on CVEs that currently have no upstream fix. Pull the vuln DB
      # from the ECR mirror to avoid GHCR anonymous rate limits in CI.
      #
      # id added so the Slack notify step below can read the pre-continue-on-error
      # outcome (steps.trivy-scan.outcome) — the job itself has continue-on-error:
      # true (report-only gate, see the job comment above), which masks the job-level
      # `needs.docker-build-scan.result` back to "success" even when this step finds
      # HIGH/CRITICAL CVEs. Without the step-level id, a downstream job could never
      # tell the two cases apart.
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: baalvion/${{ matrix.name }}:ci
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Notify Slack security channel (image has fixable HIGH/CRITICAL CVEs)
        if: steps.trivy-scan.outcome == 'failure'
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          status: failure
          title: 'Trivy — baalvion/${{ matrix.name }} image scan'
          details: 'Fixable HIGH/CRITICAL OS or library CVEs found in `baalvion/${{ matrix.name }}:ci`. See the job log for the full Trivy table.'

  # Aggregate gate required by branch protection on `main`.
  # A single stable context that turns red if ANY required job failed or was
  # cancelled — set this as the required status check in branch protection.
  cache-hygiene:
    name: Cache Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Pure Node, no dependencies — deliberately does not need an install or a
      # build, so it stays fast and cannot be skipped when a build is skipped.
      - name: Check Next.js cache hygiene
        run: node scripts/check-cache-hygiene.mjs

  ci-success:
    name: ci-success
    if: always()
    needs:
      - lockfile-integrity
      - discover-images
      - lint-and-typecheck
      - backend-go
      - backend-java
      - discover-frontends
      - frontend-build
      - security-cross-tenant
      - tenant-rls-audit
      - tenant-rls-live
      - integration-test
      - all-package-tests
      - node-package-tests
      - deploy-compose-validate
      - cache-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Upstream job results: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."

  # Failure-only notification to #baalvion-ci. Success is intentionally silent —
  # a push/PR firing CI is the common case, so paging on every green run would
  # just be noise; the required ci-success check on the PR/commit already covers
  # the "did it pass" signal for anyone watching there.
  notify-ci-failure:
    name: Notify Slack (CI failure)
    needs: ci-success
    if: always() && needs.ci-success.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_CI_WEBHOOK }}
          status: failure
          title: 'CI Pipeline'
