name: (temp) Check box2 RDS Multi-AZ status and sizing

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.CORE2_AWS_REGION || 'ap-south-1' }}
          role-to-assume: ${{ secrets.CORE2_AWS_DEPLOY_ROLE_ARN }}

      - name: Describe all RDS instances
        run: |
          set -uo pipefail
          aws rds describe-db-instances \
            --query 'DBInstances[].{Id:DBInstanceIdentifier,Class:DBInstanceClass,Engine:Engine,MultiAZ:MultiAZ,StorageGiB:AllocatedStorage,StorageType:StorageType,Status:DBInstanceStatus}' \
            --output table
