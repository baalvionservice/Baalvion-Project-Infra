name: (temp) Set box2 superadmin credential + bootstrap now

# Reads from TEMP_SUPERADMIN_EMAIL/TEMP_SUPERADMIN_PASSWORD repo secrets rather than
# workflow_dispatch inputs -- dispatch inputs are recorded in the run's plain-text metadata
# (visible via the Actions UI / API), so they're not an acceptable place for a real password.
on:
  workflow_dispatch: {}

jobs:
  set-and-bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Write SUPERADMIN_EMAIL/PASSWORD into box2 .env and bootstrap immediately
        uses: appleboy/ssh-action@v1
        env:
          SA_EMAIL: ${{ secrets.TEMP_SUPERADMIN_EMAIL }}
          SA_PASS: ${{ secrets.TEMP_SUPERADMIN_PASSWORD }}
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 1m
          envs: SA_EMAIL,SA_PASS
          script: |
            set -uo pipefail
            if [ -z "${SA_EMAIL:-}" ] || [ -z "${SA_PASS:-}" ]; then
              echo "::error::TEMP_SUPERADMIN_EMAIL/TEMP_SUPERADMIN_PASSWORD secrets not set -- aborting"
              exit 1
            fi

            echo "diag: SA_PASS length=$(printf '%s' "$SA_PASS" | wc -c) md5=$(printf '%s' "$SA_PASS" | md5sum | cut -d' ' -f1)"

            cd /opt/baalvion-box2
            ENV=deploy/consolidated/.env

            if grep -q '^SUPERADMIN_EMAIL=' "$ENV"; then
              sed -i "s|^SUPERADMIN_EMAIL=.*|SUPERADMIN_EMAIL=${SA_EMAIL}|" "$ENV"
            else
              echo "SUPERADMIN_EMAIL=${SA_EMAIL}" >> "$ENV"
            fi
            if grep -q '^SUPERADMIN_PASSWORD=' "$ENV"; then
              sed -i "s|^SUPERADMIN_PASSWORD=.*|SUPERADMIN_PASSWORD=${SA_PASS}|" "$ENV"
            else
              echo "SUPERADMIN_PASSWORD=${SA_PASS}" >> "$ENV"
            fi
            echo "SUPERADMIN_EMAIL/PASSWORD written to $ENV (values not printed)"

            docker exec \
              -e SUPERADMIN_EMAIL="$SA_EMAIL" \
              -e SUPERADMIN_PASSWORD="$SA_PASS" \
              -e PGSSLMODE=require \
              -e NODE_TLS_REJECT_UNAUTHORIZED=0 \
              consolidated-app-identity-1 \
              node /app/Backend/services/identity/auth-service/scripts/bootstrapSuperAdmin.js
            echo "::notice title=Superadmin bootstrapped::asserted in app-identity (role=super_admin)"

            echo "===== diag: verify stored row + hash server-side (bypasses HTTP/login layer entirely) ====="
            docker exec \
              -e SA_EMAIL_DIAG="$SA_EMAIL" \
              -e SA_PASS_DIAG="$SA_PASS" \
              -e NODE_TLS_REJECT_UNAUTHORIZED=0 \
              -w /app/Backend/services/identity/auth-service \
              consolidated-app-identity-1 \
              node -e '
                const { Client } = require("pg");
                const password = require("./utils/password");
                (async () => {
                  const c = new Client({
                    host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432),
                    database: process.env.DB_NAME, user: process.env.DB_USER, password: process.env.DB_PASSWORD,
                    ssl: { rejectUnauthorized: false },
                  });
                  await c.connect();
                  const email = process.env.SA_EMAIL_DIAG.toLowerCase().trim();
                  const r = await c.query("SELECT id, email, status, length(email) as elen, password_hash FROM auth.users WHERE email = $1", [email]);
                  if (r.rows.length === 0) { console.log(JSON.stringify({ found: false, queriedEmail: email })); process.exit(0); }
                  const row = r.rows[0];
                  const verifyResult = await password.verify(row.password_hash, process.env.SA_PASS_DIAG);
                  console.log(JSON.stringify({
                    found: true, id: row.id, status: row.status,
                    emailLen: row.elen, emailMatches: row.email === email,
                    hashPrefix: row.password_hash.slice(0, 10),
                    verifyResultWithGivenPassword: verifyResult,
                  }));
                  await c.end();
                })().catch(e => { console.error("DIAG ERROR:", e.message); process.exit(1); });
              '
