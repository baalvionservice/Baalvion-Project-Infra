name: (temp) Migrate box1 database to box2

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH keys for both hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CORE_EC2_SSH_KEY }}" > ~/.ssh/box1_key
          printf '%s\n' "${{ secrets.CORE2_EC2_SSH_KEY }}" > ~/.ssh/box2_key
          chmod 600 ~/.ssh/box1_key ~/.ssh/box2_key
          ssh-keyscan -H "${{ secrets.CORE_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "${{ secrets.CORE2_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Dump box1's full database (schema+data, no-owner, self-cleaning restore)
        run: |
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" '
            set -euo pipefail
            ENV=/opt/baalvion-core/deploy/consolidated/.env
            DB_HOST=$(grep -E "^DB_HOST=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_PORT=$(grep -E "^DB_PORT=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_NAME=$(grep -E "^DB_NAME=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_USER=$(grep -E "^DB_USER=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_PASSWORD=$(grep -E "^DB_PASSWORD=" "$ENV" | cut -d= -f2- | tr -d "\r")
            PGSSLMODE=require PGPASSWORD="$DB_PASSWORD" pg_dump \
              -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
              --no-owner --no-privileges --no-comments --clean --if-exists \
              | gzip > /tmp/box1_full_dump.sql.gz
            echo "dump size: $(du -h /tmp/box1_full_dump.sql.gz | cut -f1)"
          '
          scp -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}:/tmp/box1_full_dump.sql.gz" ./box1_full_dump.sql.gz
          ls -la box1_full_dump.sql.gz

      - name: Transfer dump to box2 and restore
        run: |
          scp -i ~/.ssh/box2_key ./box1_full_dump.sql.gz "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}:/tmp/box1_full_dump.sql.gz"
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" '
            set -euo pipefail
            ENV=/opt/baalvion-box2/deploy/consolidated/.env
            DB_HOST=$(grep -E "^DB_HOST=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_PORT=$(grep -E "^DB_PORT=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_NAME=$(grep -E "^DB_NAME=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_USER=$(grep -E "^DB_USER=" "$ENV" | cut -d= -f2- | tr -d "\r")
            DB_PASSWORD=$(grep -E "^DB_PASSWORD=" "$ENV" | cut -d= -f2- | tr -d "\r")
            echo "restoring into box2 DB_NAME=$DB_NAME as DB_USER=$DB_USER"
            # box2 bare host has no native psql -- run it via a throwaway postgres:16-alpine
            # container instead, same trick already used for box2s migrations this session.
            gunzip -c /tmp/box1_full_dump.sql.gz > /tmp/box1_full_dump.sql
            docker run --rm -i \
              -e PGSSLMODE=require -e PGPASSWORD="$DB_PASSWORD" \
              -v /tmp/box1_full_dump.sql:/tmp/dump.sql:ro \
              postgres:16-alpine \
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=0 -f /tmp/dump.sql 2>&1 | tail -150
            echo "=== post-restore sanity check ==="
            docker run --rm \
              -e PGSSLMODE=require -e PGPASSWORD="$DB_PASSWORD" \
              postgres:16-alpine \
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
              -c "select count(*) as cms_websites from cms.cms_websites;"
            rm -f /tmp/box1_full_dump.sql
          '

      - name: Cleanup dump files (always runs)
        if: always()
        run: |
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" "rm -f /tmp/box1_full_dump.sql.gz" || true
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" "rm -f /tmp/box1_full_dump.sql.gz" || true
          rm -f box1_full_dump.sql.gz

  migrate-media:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CORE_EC2_SSH_KEY }}" > ~/.ssh/box1_key
          printf '%s\n' "${{ secrets.CORE2_EC2_SSH_KEY }}" > ~/.ssh/box2_key
          chmod 600 ~/.ssh/box1_key ~/.ssh/box2_key
          ssh-keyscan -H "${{ secrets.CORE_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "${{ secrets.CORE2_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Tar cms_uploads on box1 and pull it down
        run: |
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" '
            set -euo pipefail
            docker exec consolidated-app-platform-1 tar -czf /tmp/cms_uploads.tar.gz -C /app/Backend/services/knowledge/cms-service/uploads .
            docker cp consolidated-app-platform-1:/tmp/cms_uploads.tar.gz /tmp/cms_uploads.tar.gz
            docker exec consolidated-app-platform-1 rm -f /tmp/cms_uploads.tar.gz
          '
          scp -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}:/tmp/cms_uploads.tar.gz" ./cms_uploads.tar.gz
          ls -la cms_uploads.tar.gz
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" "rm -f /tmp/cms_uploads.tar.gz" || true

      - name: Push tarball to box2 and extract into its cms_uploads volume
        run: |
          scp -i ~/.ssh/box2_key ./cms_uploads.tar.gz "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}:/tmp/cms_uploads.tar.gz"
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" '
            set -euo pipefail
            docker cp /tmp/cms_uploads.tar.gz consolidated-app-platform-1:/tmp/cms_uploads.tar.gz
            docker exec consolidated-app-platform-1 sh -c "mkdir -p /app/Backend/services/knowledge/cms-service/uploads && tar -xzf /tmp/cms_uploads.tar.gz -C /app/Backend/services/knowledge/cms-service/uploads && rm -f /tmp/cms_uploads.tar.gz"
            echo "=== post-extract file count on box2 ==="
            docker exec consolidated-app-platform-1 sh -c "find /app/Backend/services/knowledge/cms-service/uploads -type f | wc -l"
            rm -f /tmp/cms_uploads.tar.gz
          '
          rm -f cms_uploads.tar.gz

  migrate-nodebb:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CORE_EC2_SSH_KEY }}" > ~/.ssh/box1_key
          printf '%s\n' "${{ secrets.CORE2_EC2_SSH_KEY }}" > ~/.ssh/box2_key
          chmod 600 ~/.ssh/box1_key ~/.ssh/box2_key
          ssh-keyscan -H "${{ secrets.CORE_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "${{ secrets.CORE2_EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Dump box1's nodebb-postgres database
        run: |
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" '
            set -euo pipefail
            docker exec nodebb-postgres pg_dump -U nodebb -d nodebb --no-owner --no-privileges --clean --if-exists > /tmp/nodebb_dump.sql
            gzip -f /tmp/nodebb_dump.sql
            echo "dump size: $(du -h /tmp/nodebb_dump.sql.gz | cut -f1)"
          '
          scp -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}:/tmp/nodebb_dump.sql.gz" ./nodebb_dump.sql.gz
          ssh -i ~/.ssh/box1_key "${{ secrets.CORE_EC2_USER }}@${{ secrets.CORE_EC2_HOST }}" "rm -f /tmp/nodebb_dump.sql.gz" || true

      - name: Check box2's nodebb-postgres exists + restore
        run: |
          scp -i ~/.ssh/box2_key ./nodebb_dump.sql.gz "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}:/tmp/nodebb_dump.sql.gz"
          ssh -i ~/.ssh/box2_key "${{ secrets.CORE2_EC2_USER }}@${{ secrets.CORE2_EC2_HOST }}" '
            set -euo pipefail
            if ! docker ps --format "{{.Names}}" | grep -qx nodebb-postgres; then
              echo "BOX2 HAS NO nodebb-postgres CONTAINER -- skipping restore, needs investigation"
              exit 1
            fi
            PGUSER=$(docker exec nodebb-postgres printenv POSTGRES_USER)
            PGDB=$(docker exec nodebb-postgres printenv POSTGRES_DB)
            gunzip -c /tmp/nodebb_dump.sql.gz > /tmp/nodebb_dump.sql
            docker cp /tmp/nodebb_dump.sql nodebb-postgres:/tmp/nodebb_dump.sql
            docker exec nodebb-postgres psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=0 -f /tmp/nodebb_dump.sql 2>&1 | tail -100
            echo "=== post-restore sanity check ==="
            docker exec nodebb-postgres psql -U "$PGUSER" -d "$PGDB" -c "select count(*) from legacy_object;"
            docker exec nodebb-postgres rm -f /tmp/nodebb_dump.sql
            rm -f /tmp/nodebb_dump.sql
          '
          rm -f nodebb_dump.sql.gz
