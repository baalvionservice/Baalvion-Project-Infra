name: (temp) Bust cms category-tree cache

on:
  workflow_dispatch: {}

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Delete cms:categories:* keys from Redis so the backfilled counts show immediately
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE_EC2_HOST }}
          username: ${{ secrets.CORE_EC2_USER }}
          key: ${{ secrets.CORE_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/baalvion-core
            COMPOSE="docker compose --env-file deploy/consolidated/.env \
              -f deploy/consolidated/docker-compose.prod.yml \
              -f deploy/consolidated/docker-compose.ssl-override.yml"
            cat <<'JS' | $COMPOSE exec -T -e PGSSLMODE=require app-platform sh -lc "cat > /tmp/bust-cache.js"
            const cache = require('/app/Backend/services/knowledge/cms-service/service/cacheService');
            (async () => {
              await cache.delPattern('cms:categories:*');
              console.log('Busted cms:categories:* cache keys.');
              process.exit(0);
            })().catch((e) => { console.error(e); process.exit(1); });
            JS
            $COMPOSE exec -T -e PGSSLMODE=require app-platform node /tmp/bust-cache.js
