name: (temp) Diagnose law-service 502

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read-only pm2/container inspection over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE_EC2_HOST }}
          username: ${{ secrets.CORE_EC2_USER }}
          key: ${{ secrets.CORE_EC2_SSH_KEY }}
          script: |
            set -uo pipefail
            cd /opt/baalvion-core
            COMPOSE="docker compose --env-file deploy/consolidated/.env \
              -f deploy/consolidated/docker-compose.prod.yml \
              -f deploy/consolidated/docker-compose.ssl-override.yml"
            echo "===== docker compose ps ====="
            $COMPOSE ps
            echo "===== pm2 status inside app-platform ====="
            $COMPOSE exec -T app-platform pm2 jlist 2>&1 | node -e "
              let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                try{const j=JSON.parse(d);j.forEach(p=>console.log(p.name, p.pm2_env.status, 'restarts='+p.pm2_env.restart_time, 'port='+(p.pm2_env.env&&p.pm2_env.env.PORT)));}
                catch(e){console.log('RAW:',d.slice(0,2000));}
              });" || $COMPOSE exec -T app-platform pm2 list
            echo "===== last 200 lines of law-service pm2 log ====="
            $COMPOSE exec -T app-platform pm2 logs law-service --lines 200 --nostream 2>&1 || true
            echo "===== is anything listening on 3015 inside the container ====="
            $COMPOSE exec -T app-platform sh -lc "netstat -tlnp 2>/dev/null | grep 3015 || ss -tlnp 2>/dev/null | grep 3015 || echo 'nothing on 3015'"
            echo "===== direct curl to law-service from inside app-platform ====="
            $COMPOSE exec -T app-platform sh -lc "curl -s -o /dev/null -w 'code=%{http_code}\n' --max-time 5 http://localhost:3015/health || echo 'curl failed'"
