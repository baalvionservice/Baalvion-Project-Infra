name: (temp) Diagnose box2 CMS content depth + author SSR gap

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dump raw content_blocks structure for one article
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail
            docker exec -w /app/Backend/services/knowledge/cms-service consolidated-app-platform-1 node -e "
              const db = require('./models');
              (async () => {
                const [rows] = await db.sequelize.query(
                  \"SELECT title, content_blocks FROM cms.cms_contents WHERE slug = 'what-is-a-class-action-lawsuit'\"
                );
                console.log(JSON.stringify(rows[0], null, 2).slice(0, 4000));
                process.exit(0);
              })().catch(e => { console.log('ERROR:', e.message); process.exit(1); });
            "
