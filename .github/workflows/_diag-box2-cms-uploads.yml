name: (temp) Diagnose box2 CMS upload URLs

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check for legacy broken URLs + which categories reference them
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail
            docker exec -w /app/Backend/services/knowledge/cms-service consolidated-app-platform-1 node -e "
              const db = require('./models');
              (async () => {
                const [bad] = await db.sequelize.query(\"SELECT id, filename, url, created_at FROM cms.cms_media_assets WHERE url NOT LIKE 'https://api.baalvion.com%' ORDER BY created_at DESC\");
                console.log('===== media assets with non-canonical URL host =====');
                console.log(JSON.stringify(bad, null, 2));
                console.log('total media assets:');
                const [[cnt]] = await db.sequelize.query(\"SELECT COUNT(*)::int AS c FROM cms.cms_media_assets\");
                console.log(JSON.stringify(cnt));
                console.log('===== categories with an imageUrl set =====');
                const [cats] = await db.sequelize.query(\"SELECT id, website_id, name, slug, image_url, updated_at FROM cms.cms_categories WHERE image_url IS NOT NULL ORDER BY updated_at DESC LIMIT 15\");
                console.log(JSON.stringify(cats, null, 2));
                process.exit(0);
              })().catch(e => { console.log('ERROR:', e.message); process.exit(1); });
            "
