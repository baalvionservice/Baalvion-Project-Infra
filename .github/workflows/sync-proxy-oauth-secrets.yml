# ─────────────────────────────────────────────────────────────────────────────
# Sync proxy-service Google/Facebook OAuth client credentials → box2, then
# restart ONLY app-edge-realtime (the container proxy-service runs in) — not
# the full consolidated stack. Reuses the CORE2_EC2_* SSH secrets already set
# up for deploy-consolidated-box2.yml.
#
# Manual trigger only. Values come from repo secrets (never committed, never
# logged — GitHub Actions masks any log line containing a registered secret).
# ─────────────────────────────────────────────────────────────────────────────
name: Sync proxy-service OAuth secrets (box2)

on:
  workflow_dispatch: {}

concurrency:
  group: sync-proxy-oauth-secrets
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Push OAuth creds + restart app-edge-realtime
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check target + secrets are configured
        id: gate
        env:
          EC2_HOST: ${{ secrets.CORE2_EC2_HOST }}
          EC2_USER: ${{ secrets.CORE2_EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.CORE2_EC2_SSH_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "${EC2_HOST}" ] || [ -z "${EC2_USER}" ] || [ -z "${EC2_SSH_KEY}" ]; then
            echo "::error::CORE2_EC2_* not configured"; exit 1
          fi
          if [ -z "${GOOGLE_OAUTH_CLIENT_ID}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET repo secrets not set"; exit 1
          fi

      - name: Update deploy/consolidated/.env + restart app-edge-realtime only
        uses: appleboy/ssh-action@v1
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          envs: GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET
          script: |
            set -euo pipefail
            cd /opt/baalvion-box2
            ENV=deploy/consolidated/.env
            # Rewrite-or-append each key. Avoids sed on secret VALUES (which may contain
            # sed-hostile characters) by only ever using KEY names in the pattern.
            for KEY in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
              VAL="$(eval echo "\${$KEY}")"
              grep -v "^${KEY}=" "$ENV" > "${ENV}.tmp" || true
              mv "${ENV}.tmp" "$ENV"
              echo "${KEY}=${VAL}" >> "$ENV"
            done
            COMPOSE="docker compose --env-file $ENV -f deploy/consolidated/docker-compose.prod.yml"
            $COMPOSE up -d --no-build --no-deps app-edge-realtime
            echo "::notice title=proxy-service OAuth creds synced::app-edge-realtime restarted with updated Google OAuth credentials."
