name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Block GPL/AGPL-style copyleft from entering a proprietary codebase.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          # jszip is dual-licensed "GPL-3.0-only OR MIT" — usable under MIT, but the action
          # flags it because GPL-3.0 appears in the SPDX OR-expression. Exempt it explicitly.
          #
          # sharp's prebuilt libvips binaries are LGPL-3.0-or-later. sharp itself is
          # Apache-2.0; these are separate, unmodified shared-library packages it loads at
          # runtime, which is the linking case LGPL section 4 permits in proprietary software.
          # They are ALREADY shipped on main at 1.3.2 — dependency-review only reports
          # *changed* dependencies, so any sharp patch re-surfaces them and the policy blocks
          # its own security fix. Bumping sharp for GHSA-rgj7-g3m4-5g8c could not land without
          # this. Exempt the binaries only; the deny-list still covers everything else.
          allow-dependencies-licenses: >-
            pkg:npm/jszip,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64
          # Acknowledged transitive build-time advisories on node-tar 6.2.1, pulled ONLY by
          # @mapbox/node-pre-gyp@1.0.11 (install-time prebuilt-binary fetch, not runtime code).
          # Still tracked by Dependabot. Remediate by upgrading node-pre-gyp to v2 (uses tar@7),
          # then drop this allow-list.
          #
          # GHSA-5xrq-8626-4rwp — vitest <…: arbitrary file read/RCE ONLY while the Vitest UI
          # server (`vitest --ui` / API server) is listening on a dev machine. It is dev-tooling
          # only: CI/prod test runs never start the UI server, so there is no runtime exposure.
          # Still tracked by Dependabot; remediate by bumping vitest, then drop this entry.
          allow-ghsas: GHSA-8qq5-rm4j-mr97,GHSA-r6q2-hw4h-h46w,GHSA-34x7-hfp2-rc4v,GHSA-83g3-92jg-28cx,GHSA-qffp-2rhf-9h96,GHSA-9ppj-qmqm-q256,GHSA-5xrq-8626-4rwp

  notify-slack-security:
    name: Notify Slack (dependency review failed)
    needs: dependency-review
    if: always() && needs.dependency-review.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          status: failure
          title: 'Dependency Review'
          details: 'A PR introduced a HIGH+ severity vulnerable dependency or a denied license (GPL/AGPL/LGPL family). See the PR comment for the flagged package.'
