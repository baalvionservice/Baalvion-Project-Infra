name: (temp) Fix box2 law-service migration checksum drift

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Correct drifted checksums for 0005/0006 (idempotency-only edits) and restart law-service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -uo pipefail
            echo "===== correcting stored checksums (metadata only, no schema change) ====="
            docker exec -w /app/Backend/services/knowledge/law-service consolidated-app-platform-1 node -e "
              const db = require('./models');
              (async () => {
                await db.sequelize.query(\"UPDATE legal.schema_migrations SET checksum = 'd71ead339a0e7490f04ec0fef0e163b6d71d412a' WHERE filename = '0005_geo_taxonomy.sql'\");
                await db.sequelize.query(\"UPDATE legal.schema_migrations SET checksum = 'b174c6b36384775994020f767de1f4c9413d7578' WHERE filename = '0006_practice_areas.sql'\");
                const [rows] = await db.sequelize.query(\"SELECT filename, checksum FROM legal.schema_migrations ORDER BY filename\");
                console.log(JSON.stringify(rows, null, 2));
                process.exit(0);
              })().catch(e => { console.log('ERROR:', e.message); process.exit(1); });
            "
            echo "===== restarting law-service ====="
            docker exec consolidated-app-platform-1 pm2 restart law-service
            sleep 8
            echo "===== post-restart status ====="
            docker exec consolidated-app-platform-1 pm2 jlist | node -e "
              let d='';process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                const p = JSON.parse(d).find(x => x.name === 'law-service');
                console.log('status:', p.pm2_env.status, 'restarts:', p.pm2_env.restart_time, 'uptime_ms:', Date.now() - p.pm2_env.pm_uptime);
              });
            "
            echo "===== tail fresh logs ====="
            docker exec consolidated-app-platform-1 pm2 logs law-service --lines 20 --nostream
