name: (temp) Fetch box2 superadmin credential (via artifact, not logged)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read SUPERADMIN_EMAIL/PASSWORD from box2 .env into a file (never echoed to the log)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 1m
          script: |
            set -uo pipefail
            cd /opt/baalvion-box2
            ENV=deploy/consolidated/.env
            {
              grep -E '^SUPERADMIN_EMAIL=' "$ENV" || echo 'SUPERADMIN_EMAIL='
              grep -E '^SUPERADMIN_PASSWORD=' "$ENV" || echo 'SUPERADMIN_PASSWORD='
            } > /tmp/_cred.env
            echo "wrote /tmp/_cred.env (not printed)"

      - name: Pull the file back to the runner over SSH (scp, not through job log)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          source: "/tmp/_cred.env"
          target: "cred-artifact"
          strip_components: 1

      - name: Clean up remote temp file
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE2_EC2_HOST }}
          username: ${{ secrets.CORE2_EC2_USER }}
          key: ${{ secrets.CORE2_EC2_SSH_KEY }}
          script: rm -f /tmp/_cred.env

      - name: Upload as a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: box2-superadmin-cred
          path: cred-artifact/_cred.env
          retention-days: 1
