# Financial Services CI/CD — the real green-build gate for the Java suite.
# (This sandbox has no Maven/JDK17, so `mvn verify` runs HERE, not on a dev laptop.)
# Source of truth for edits: Backend/services/commerce/financial-services-java/deploy/ci/financial-services.yml
name: Financial Services CI/CD

on:
  push:
    branches: [main, hardening-phase-1, "release/**", "feat/**"]
    paths:
      - "Backend/services/commerce/financial-services-java/**"
      - ".github/workflows/financial-services.yml"
  pull_request:
    branches: [main, hardening-phase-1, "release/**"]
    paths:
      - "Backend/services/commerce/financial-services-java/**"

env:
  MODULE_DIR: Backend/services/commerce/financial-services-java
  # Local-only image tag prefix used for the Trivy scan below. The deployed image
  # (baalvion/payment-service) is built + pushed to Amazon ECR by
  # deploy-consolidated-box2.yml — deploy.yml, named here before, was deleted
  # 2026-07-02. This workflow no longer pushes to any registry — it builds + scans only.
  IMAGE_PREFIX: baalvion-financial

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, test (Testcontainers), package
        working-directory: ${{ env.MODULE_DIR }}
        run: mvn -B -ntp clean verify
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: financial-jars
          path: ${{ env.MODULE_DIR }}/*/target/*.jar
          if-no-files-found: ignore

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Trivy FS (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.MODULE_DIR }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

  images:
    name: Build & scan images
    needs: [build-test, trivy-fs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - ledger-service
          - payment-service
          - escrow-service
          - settlement-service
          - reconciliation-service
          - audit-service
          - reporting-service
          - risk-service
          - trade-finance-service
          - credit-service
          - fx-service
          - wallet-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (${{ matrix.service }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.MODULE_DIR }}
          file: ${{ env.MODULE_DIR }}/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
      - name: Trivy image scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
      # GHCR login + push removed during the ECR consolidation. The deployed Java
      # payment-service is built + pushed to Amazon ECR (repo baalvion/payment-service,
      # build-arg SERVICE=payment-service) by deploy-consolidated-box2.yml — deploy.yml,
      # named here before, was deleted 2026-07-02. This job builds + Trivy-scans only.

  # build-test / trivy-fs / images are NOT continue-on-error here (unlike ci.yml's
  # report-only docker-build-scan), so a Trivy finding fails the job directly and is
  # already a real workflow failure — one notification covers both "tests broke" and
  # "a fixable HIGH/CRITICAL CVE was introduced" without paging #devops-alerts twice.
  notify-ci-failure:
    name: Notify Slack (CI failure)
    needs: [build-test, trivy-fs, images]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_CI_WEBHOOK }}
          status: failure
          title: 'Financial Services CI/CD'
          details: 'Build/test, Trivy filesystem scan, or a per-service image Trivy scan failed — check the job log for which.'
