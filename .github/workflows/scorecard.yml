name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly — Monday 08:00 UTC
    - cron: "0 8 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard supply-chain analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: results.sarif

  notify-slack-security:
    name: Notify Slack (Scorecard run failed)
    needs: analysis
    if: always() && needs.analysis.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          status: failure
          title: 'OSSF Scorecard'
          details: 'The supply-chain analysis run itself failed to complete — this does not necessarily mean the score dropped. Check the run log.'
