<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-label="Law Elite Network">
  <title>Law Elite Network</title>
  <!-- Icon: Navy square bg -->
  <rect x="0" y="0" width="100" height="100" fill="#0F2440" rx="14"/>
  <!-- Balance beam -->
  <rect x="16" y="31" width="68" height="6" fill="#F6F4EF"/>
  <!-- Vertical post -->
  <rect x="47" y="37" width="6" height="30" fill="#F6F4EF"/>
  <!-- Base -->
  <rect x="37" y="67" width="26" height="6" fill="#F6F4EF"/>
  <!-- Left chain -->
  <rect x="21" y="37" width="3" height="14" fill="#F6F4EF"/>
  <!-- Right chain -->
  <rect x="76" y="37" width="3" height="14" fill="#F6F4EF"/>
  <!-- Left pan -->
  <circle cx="22.5" cy="51" r="11.5" fill="none" stroke="#F6F4EF" stroke-width="3"/>
  <!-- Right pan -->
  <circle cx="77.5" cy="51" r="11.5" fill="none" stroke="#F6F4EF" stroke-width="3"/>

  <!-- Wordmark: LAW ELITE -->
  <text
    x="118"
    y="52"
    font-family="'Libre Franklin', 'Franklin Gothic Medium', Arial Narrow, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#0F2440"
    letter-spacing="-0.5"
    dominant-baseline="auto"
  >LAW ELITE</text>

  <!-- NETWORK subtitle -->
  <text
    x="118"
    y="80"
    font-family="'Libre Franklin', 'Franklin Gothic Medium', Arial Narrow, Arial, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#5b6b80"
    letter-spacing="3"
    dominant-baseline="auto"
  >NETWORK</text>
</svg>
