<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="Law Elite Network">
  <title>Law Elite Network</title>
  <!-- Icon: Navy square bg -->
  <rect x="0" y="0" width="120" height="120" fill="#0F2440" rx="18"/>
  <!-- Balance beam -->
  <rect x="15" y="34" width="90" height="9" fill="#F6F4EF"/>
  <!-- Vertical post -->
  <rect x="54" y="43" width="12" height="44" fill="#F6F4EF"/>
  <!-- Base -->
  <rect x="39" y="87" width="42" height="9" fill="#F6F4EF"/>
  <!-- Left chain -->
  <rect x="22" y="43" width="4.5" height="17" fill="#F6F4EF"/>
  <!-- Right chain -->
  <rect x="93.5" y="43" width="4.5" height="17" fill="#F6F4EF"/>
  <!-- Left pan (solid bowl) -->
  <path d="M5,60 a18,16.5 0 0 0 37,0 z" fill="#F6F4EF"/>
  <!-- Right pan (solid bowl) -->
  <path d="M78,60 a18,16.5 0 0 0 37,0 z" fill="#F6F4EF"/>

  <!-- Wordmark: LAW ELITE -->
  <text
    x="138"
    y="62"
    font-family="'Libre Franklin', 'Franklin Gothic Medium', Arial Narrow, Arial, sans-serif"
    font-size="40"
    font-weight="900"
    fill="#0F2440"
    letter-spacing="-0.5"
    dominant-baseline="auto"
  >LAW ELITE</text>

  <!-- NETWORK badge -->
  <rect x="138" y="72" width="185" height="30" fill="#E13131" rx="2"/>
  <text
    x="230.5"
    y="93"
    font-family="'Libre Franklin', 'Franklin Gothic Medium', Arial Narrow, Arial, sans-serif"
    font-size="17"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="3"
    text-anchor="middle"
    dominant-baseline="auto"
  >NETWORK</text>
</svg>
