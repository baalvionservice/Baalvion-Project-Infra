# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # A single instance means a crawl burst (Googlebot, a search-console
  # validation pass, or just concurrent visitors) queues every request onto
  # one Cloud Run instance. Combined with per-request backend fetches, that
  # queueing is what turned into false "not found" pages under load — see
  # the mock-fallback-to-notFound() path in articlesService.getArticleBySlug.
  # Raise this so bursts scale out instead of serializing onto one instance.
  maxInstances: 4
