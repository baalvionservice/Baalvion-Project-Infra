<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="#000000"/>

  <g filter="url(#glow)" fill="#39FF14">
    <!-- crossbones -->
    <rect x="8" y="46" width="34" height="5" rx="2.5" transform="rotate(-28 25 48.5)"/>
    <rect x="8" y="46" width="34" height="5" rx="2.5" transform="rotate(28 39 48.5)"/>
    <circle cx="12" cy="45.5" r="3"/>
    <circle cx="12" cy="55.5" r="3"/>
    <circle cx="52" cy="45.5" r="3"/>
    <circle cx="52" cy="55.5" r="3"/>

    <!-- cranium -->
    <path d="M32 6
             C 20 6 13 15 13 25
             C 13 32 16 35.5 18.5 38.5
             L 18.5 44
             C 18.5 46.5 20.5 48 22.5 48
             L 41.5 48
             C 43.5 48 45.5 46.5 45.5 44
             L 45.5 38.5
             C 48 35.5 51 32 51 25
             C 51 15 44 6 32 6 Z"/>
  </g>

  <!-- eyes / nose cut-outs -->
  <ellipse cx="24" cy="26" rx="5.2" ry="6.4" fill="#000000"/>
  <ellipse cx="40" cy="26" rx="5.2" ry="6.4" fill="#000000"/>
  <path d="M32 30 L29 37 L35 37 Z" fill="#000000"/>

  <!-- teeth -->
  <g fill="#000000">
    <rect x="22.5" y="42.5" width="3.4" height="5" rx="0.6"/>
    <rect x="26.6" y="42.5" width="3.4" height="5" rx="0.6"/>
    <rect x="30.7" y="42.5" width="3.4" height="5" rx="0.6"/>
    <rect x="34.8" y="42.5" width="3.4" height="5" rx="0.6"/>
    <rect x="38.9" y="42.5" width="3.4" height="5" rx="0.6"/>
  </g>
</svg>
